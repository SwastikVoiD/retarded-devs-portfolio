{% extends "base.html" %}

{% block extra_css %}
<style>
    .edit-container {
        padding-top: 100px;
        min-height: 80vh;
        max-width: 800px;
    }
    .form-card {
        background: var(--surface-color);
        padding: 2rem;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        margin-top: 2rem;
        margin-bottom: 4rem;
    }
    .form-group {
        margin-bottom: 1.5rem;
    }
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--text-secondary);
        font-weight: 500;
    }
    .form-group input, .form-group textarea {
        width: 100%;
        padding: 0.75rem;
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        color: #fff;
        border-radius: 4px;
    }
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
    }
</style>
{% endblock %}

{% block content %}
    <div class="container edit-container">
        <a href="{{ url_for('dashboard') }}" style="color: var(--text-secondary); display: inline-flex; align-items: center; gap: 0.5rem;"><i data-feather="arrow-left"></i> Back to Dashboard</a>
        
        <h2 style="margin-top: 1.5rem;">{% if member %}Edit Team Member{% else %}New Team Member{% endif %}</h2>
        
        <div class="form-card">
            <form action="{{ url_for('edit_member', id=member.id) if member else url_for('new_member') }}" method="POST">
                
                <h3 style="color: var(--accent-color); margin-bottom: 1rem; font-size: 1.1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Basic Info</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Name *</label>
                        <input type="text" name="name" value="{{ member.name if member else '' }}" required>
                    </div>
                    <div class="form-group">
                        <label>Role / Title *</label>
                        <input type="text" name="role" value="{{ member.role if member else '' }}" required placeholder="e.g. Lead Developer">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Short Bio (2-3 sentences) *</label>
                    <textarea name="short_bio" rows="2" required>{{ member.short_bio if member else '' }}</textarea>
                </div>

                <div class="form-group">
                    <label>Profile Image URL (leave blank for random avatar)</label>
                    <input type="url" name="image_url" value="{{ member.image_url if member else '' }}">
                </div>

                <h3 style="color: var(--accent-color); margin-top: 2rem; margin-bottom: 1rem; font-size: 1.1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Detailed Resume</h3>
                
                <div class="form-group">
                    <label>Full Biography</label>
                    <textarea name="full_bio" rows="5">{{ member.full_bio if member else '' }}</textarea>
                </div>

                <div class="form-group">
                    <label>Experience & Background</label>
                    <textarea name="experience" rows="5">{{ member.experience if member else '' }}</textarea>
                </div>

                <div class="form-group">
                    <label>Team Contributions</label>
                    <textarea name="contributions" rows="5">{{ member.contributions if member else '' }}</textarea>
                </div>

                <h3 style="color: var(--accent-color); margin-top: 2rem; margin-bottom: 1rem; font-size: 1.1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Links</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label>GitHub Profile URL</label>
                        <input type="url" name="github_link" value="{{ member.github_link if member else '' }}">
                    </div>
                    <div class="form-group">
                        <label>Twitter/X Profile URL</label>
                        <input type="url" name="twitter_link" value="{{ member.twitter_link if member else '' }}">
                    </div>
                </div>

                <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary">Save Member</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
