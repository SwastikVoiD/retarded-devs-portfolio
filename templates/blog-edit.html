{% extends "base.html" %}

{% block extra_css %}
<style>
    .edit-container {
        padding-top: 100px;
        min-height: 80vh;
        max-width: 800px;
    }
    .form-card {
        background: var(--surface-color);
        padding: 2rem;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        margin-top: 2rem;
        margin-bottom: 4rem;
    }
    .form-group {
        margin-bottom: 1.5rem;
    }
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--text-secondary);
        font-weight: 500;
    }
    .form-group input, .form-group textarea {
        width: 100%;
        padding: 0.75rem;
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        color: #fff;
        border-radius: 4px;
    }
</style>
{% endblock %}

{% block content %}
    <div class="container edit-container">
        <a href="{{ url_for('dashboard') }}" style="color: var(--text-secondary); display: inline-flex; align-items: center; gap: 0.5rem;"><i data-feather="arrow-left"></i> Back to Dashboard</a>
        
        <h2 style="margin-top: 1.5rem;">{% if blog %}Edit Blog Post{% else %}New Blog Post{% endif %}</h2>
        
        <div class="form-card">
            <form action="{{ url_for('edit_blog', id=blog.id) if blog else url_for('new_blog') }}" method="POST">
                
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" name="title" value="{{ blog.title if blog else '' }}" required>
                </div>
                
                <div class="form-group">
                    <label>Author *</label>
                    <input type="text" name="author" value="{{ blog.author if blog else '' }}" required>
                </div>

                <div class="form-group">
                    <label>Tags (comma separated)</label>
                    <input type="text" name="tags" value="{{ blog.tags if blog else '' }}" placeholder="e.g. Technology, Thoughts, Open Source">
                </div>
                
                <div class="form-group">
                    <label>Content * (Supports plain text with line breaks)</label>
                    <textarea name="content" rows="15" required style="resize: vertical;">{{ blog.content if blog else '' }}</textarea>
                </div>

                <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary">Publish Post</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
